<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h2>Formulario de Notas</h2>

    <form method="POST">
        <label>Nota 1:</label><br><br>
        <input type="number" name="nota1" min="10" max="70" required><br><br>

        <label>Nota 2:</label><br><br>
        <input type="number" name="nota2" min="10" max="70" required>
        <br><br>


        <label>Nota 3:</label><br><br>
        <input type="number" name="nota3" min="10" max="70" required><br><br>
        
        <label>Asistencia (%):</label><br><br>
        <input type="number" name="asistencia" min="0" max="100" required><br><br>

        <button type="submit">Enviar</button>
        
    </form>
    {% if promedio is not none %}
        <p>Promedio: {{ promedio }}</p>
        <p>Estado: {{ estado }}</p>
    {% endif %}
</body>
</html>
