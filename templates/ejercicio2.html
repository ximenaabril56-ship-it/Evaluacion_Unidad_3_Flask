<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <h2>Formulario de Nombres</h2>

    <form method="POST">
        <label>Nombre 1:</label><br><br>
        <input type="text" name="nombre1" required><br><br>

        <label>Nombre 2:</label><br><br>
        <input type="text" name="nombre2" required><br><br>
        
        <label>Nombre 3:</label><br><br>
        <input type="text" name="nombre3" required><br><br>

        <button type="submit">Enviar</button>
    </form>

    {% if nombre_mayor is not none%}
        <p>El nombre con mayor cantiidad de caracteres es: {{ nombre_mayor }}</p>
        <p>El nombre tiene: {{ cantidad }} caracteres</p>
    {% endif %}

</body>
</html>
